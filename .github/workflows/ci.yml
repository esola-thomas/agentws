name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck jq
      - run: shellcheck -S warning -s bash bin/agentws lib/*.sh providers/*.sh mcp/agentws-mcp install.sh scripts/*.sh
      - run: scripts/check-release.sh
      - run: bats test/
        env:
          TERM: dumb
